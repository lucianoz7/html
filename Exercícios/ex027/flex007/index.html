<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        body {
            font-family: monospace;
            font-size: 1.3em;
        }
        h1 {
            text-align: center;
        }

        div.conteiner {
            
            background-color: aquamarine;
            display: flex;
            flex-flow: row wrap;
            align-content: center;
            justify-content: center;
            height: 400px;
        }

        div.item {
            
            border-radius: 5px;
            text-align: center;
            align-content: center;
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: salmon;
        }
        
        #i1 {
            order: 4;
        }

    </style>
</head>
<body>
    <h1>Testando Flexbox</h1>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
        <div class="item" id="i8">H</div>
        <div class="item" id="i9">I</div>
        <div class="item" id="i10">J</div>
        <div class="item" id="i11">K</div>
    </div>
</body>
</html>
